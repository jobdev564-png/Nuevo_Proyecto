{% extends "base.html" %}

{% block title %}Editar Tarea - TaskControl{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 600px;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Editar Tarea</h2>

    <form action="{{ url_for('tasks.edit_task_route', task_id=task.id) }}" method="POST">
        <div class="form-group">
            <label for="title">Título *</label>
            <input type="text" id="title" name="title" class="form-control" required value="{{ task.title }}">
        </div>

        <div class="form-group">
            <label for="due_date">Fecha Límite</label>
            <input type="date" id="due_date" name="due_date" class="form-control" value="{{ task.due_date.isoformat() if task.due_date else '' }}">
        </div>

        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ task.description or '' }}</textarea>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
            <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
