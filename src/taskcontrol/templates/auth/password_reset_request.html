{% extends "base.html" %}

{% block title %}Recuperar Contraseña - TaskControl{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Recuperar Contraseña</h2>

    <form action="{{ url_for('auth.password_reset_request') }}" method="POST" novalidate>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="tu@ejemplo.com">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Enviar Instrucciones</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600;">Volver al inicio de sesión</a>
    </p>
</div>
{% endblock %}
