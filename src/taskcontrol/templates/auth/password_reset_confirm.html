{% extends "base.html" %}

{% block title %}Nueva Contraseña - TaskControl{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Establecer Nueva Contraseña</h2>

    <form action="{{ url_for('auth.password_reset_confirm') }}" method="POST" novalidate>
        <input type="hidden" name="token" value="{{ token or '' }}">
        <div class="form-group">
            <label for="new_password">Nueva Contraseña (mínimo 8 caracteres)</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8" placeholder="Tu nueva contraseña">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Restablecer Contraseña</button>
    </form>
</div>
{% endblock %}
