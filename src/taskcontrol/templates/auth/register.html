{% extends "base.html" %}

{% block title %}Registro - TaskControl{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Crear Cuenta</h2>
    
    <form action="{{ url_for('auth.register') }}" method="POST" novalidate>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="tu@ejemplo.com" value="{{ email or '' }}">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Mínimo 8 caracteres">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Registrarse</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600;">Inicia sesión</a>
    </p>
</div>
{% endblock %}
